<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbf6">
  <title>Stekkies · Find your perfect roommate</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f16259'/><path d='M16 7l8 7v10a1 1 0 0 1-1 1h-5v-6h-4v6H9a1 1 0 0 1-1-1V14z' fill='%23fffbf6'/></svg>">

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">

  <script defer src="data.js"></script>
  <script defer src="format.js"></script>
  <script defer src="matching.js"></script>
  <script defer src="simulation.js"></script>
  <script defer src="db.js"></script>
  <script defer src="store.js"></script>
  <script defer src="roommates.js"></script>
  <script defer src="messages.js"></script>
  <script defer src="listings.js"></script>
  <script defer src="household.js"></script>
  <script defer src="market.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <noscript>This demo needs JavaScript enabled.</noscript>

  <p class="conceptbar">
    <strong>Student concept demo.</strong> Not Stekkies, and not affiliated with them. Every
    person, home and price here is invented, and nothing you enter leaves your browser.
  </p>

  <header class="topbar">
    <a class="brand" href="#" data-go="home" aria-label="Stekkies home">
      <img src="assets/stekkies-logo.svg" alt="Stekkies" class="brand-logo">
    </a>

    <nav class="mainnav" aria-label="Main">
      <button type="button" data-go="home" class="navlink">Home</button>
      <button type="button" data-go="listings" class="navlink">Listings</button>
      <button type="button" data-go="roommates" class="navlink" id="nav-roommates">Roommates</button>
      <button type="button" data-go="messages" class="navlink" id="nav-messages">Messages</button>
      <button type="button" data-go="market" class="navlink">Market impact</button>
    </nav>

    <div class="topbar-right">
      <button type="button" class="bell" id="bell" aria-haspopup="true" aria-expanded="false"
              aria-label="Invitations">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="19" height="19">
          <path d="M12 3a6 6 0 0 0-6 6v4l-1.6 2.6A1 1 0 0 0 5.3 17h13.4a1 1 0 0 0 .85-1.4L18 13V9a6 6 0 0 0-6-6z"
            fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
          <path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span class="badge" id="invite-badge" hidden></span>
      </button>
      <div class="dropdown" id="bell-menu" hidden></div>
      <button type="button" class="account" id="account-chip" aria-haspopup="true"
              aria-expanded="false" aria-label="Your account">Account</button>
      <div class="dropdown accountmenu" id="account-menu" hidden></div>
    </div>
  </header>

  <main id="screen" tabindex="-1"></main>

  <!-- A native dialog: focus stays inside while it is open, the page behind is inert, and
       Escape closes it. The div it replaces let Tab wander off into the page underneath. -->
  <dialog id="overlay" hidden></dialog>

  <!-- Toasts: what just happened, and Undo where it can be taken back. -->
  <div id="toasts" class="toast-region" role="status" aria-live="polite"></div>

  <footer class="appfoot">
    <span id="storage-note">Stekkies concept demo · AI Strategy Lab · not affiliated with Stekkies</span>
    <button type="button" class="linkbutton" id="reset-demo">Reset everything</button>
  </footer>
</body>
</html>
